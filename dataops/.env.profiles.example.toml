# One [[profile]] block per Groq key. Keys only ever live in these files,
# never in the database or the UI. Copy this file to .env.profiles.toml and
# paste real keys; model is optional and falls back to GROQ_MODEL in .env.
#
#   name     a label you recognize (kept in usage history) — never a secret
#   api_key  the Groq API key (gsk_...)
#   model    optional; omit to use GROQ_MODEL, or set per credit/plan

[[profile]]
name = "personal-free"
api_key = "gsk_xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx"
# model = "qwen/qwen3.8-27b"

[[profile]]
name = "work-credits"
api_key = "gsk_yyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyy"

# Per-profile limits are NOT configured here. When a profile is first seen,
# free-tier defaults are seeded into the dataops_quotas table and the operator
# edits those rows directly.