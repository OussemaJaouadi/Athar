[project]
name = "athar-dataops"
version = "0.1.0"
description = "Athar's interactive DataOps terminal workspace"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "textual[syntax]>=8.2.8",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "httpx>=0.27.0",
    "pyturso>=0.7.2",
    "arabic-reshaper>=3.0.1",
    "python-bidi>=0.6.11",
]

[project.scripts]
athar-dataops = "athar_dataops.main:main"

[build-system]
requires = ["uv_build>=0.8.18,<0.9.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "textual-dev>=1.8.0",
]
